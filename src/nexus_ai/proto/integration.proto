syntax = "proto3";
package integration;

// ─── Common ────────────────────────────────────────────────────────

message Empty {}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

// ─── Document Upload ───────────────────────────────────────────────

message DocumentUploadRequest {
  int32 patient_id = 1;
  string file_path = 2;
  string mime_type = 3;
  string document_category = 4;    // prescription, lab_report, etc.
  int32 prescription_id = 5;       // optional
}

message DocumentUploadResponse {
  bool success = 1;
  string drive_file_id = 2;
  string drive_file_url = 3;
  string drive_path = 4;
  string classification = 5;
  string message = 6;
}

// ─── Calendar ──────────────────────────────────────────────────────

message CalendarEventRequest {
  int32 patient_id = 1;
  string summary = 2;
  int32 duration_minutes = 3;
  int32 offset_minutes = 4;
  int32 offset_days = 5;
  string description = 6;
}

message CalendarEventResponse {
  bool success = 1;
  string event_id = 2;
  string event_url = 3;
  string message = 4;
}

// ─── Email ─────────────────────────────────────────────────────────

message EmailRequest {
  string to = 1;
  string subject = 2;
  string body_html = 3;
}

message EmailResponse {
  bool success = 1;
  string message_id = 2;
  string message = 3;
}

// ─── Drug Label ────────────────────────────────────────────────────

message DrugLabelRequest {
  string medication_name = 1;
}

message DrugLabelResponse {
  bool found = 1;
  string medication_name = 2;
  string summary = 3;
  string url = 4;
  string raw_text = 5;
}

// ─── Pharmacy Search ───────────────────────────────────────────────

message PharmacySearchRequest {
  string location_query = 1;
  string medication_name = 2;
  double latitude = 3;
  double longitude = 4;
  int32 radius_meters = 5;
  int32 max_results = 6;
}

message PharmacyResult {
  string name = 1;
  string address = 2;
  double latitude = 3;
  double longitude = 4;
  double rating = 5;
  bool open_now = 6;
  string place_id = 7;
}

message PharmacySearchResponse {
  bool success = 1;
  repeated PharmacyResult results = 2;
  string message = 3;
}

// ─── Care Route ────────────────────────────────────────────────────

message CareRouteRequest {
  string origin = 1;
  string destination = 2;
  string travel_mode = 3;
  double origin_lat = 4;
  double origin_lng = 5;
}

message CareRouteResponse {
  bool success = 1;
  string distance = 2;
  string duration = 3;
  string summary = 4;
  string message = 5;
}

// ─── Medical Memory ────────────────────────────────────────────────

message StoreMemoryRequest {
  int32 patient_id = 1;
  string source_type = 2;
  string modality = 3;
  string content = 4;
  string source_reference = 5;
  string drive_file_id = 6;
  string drive_file_url = 7;
  string drive_path = 8;
  string metadata_json = 9;
}

message StoreMemoryResponse {
  bool success = 1;
  int32 memory_id = 2;
  bool vector_synced = 3;
  string message = 4;
}

message SearchMemoryRequest {
  int32 patient_id = 1;
  string query_text = 2;
  string modality = 3;
  int32 limit = 4;
}

message MemoryResult {
  int32 memory_id = 1;
  string source_type = 2;
  string source_reference = 3;
  string modality = 4;
  string embedding_model = 5;
  string summary_text = 6;
  string drive_file_id = 7;
  string drive_file_url = 8;
  double similarity = 9;
}

message SearchMemoryResponse {
  bool success = 1;
  repeated MemoryResult results = 2;
  string message = 3;
}

// ─── Audio / Speech ────────────────────────────────────────────────

message AudioRequest {
  bytes audio_bytes = 1;
  string encoding = 2;
  int32 sample_rate_hertz = 3;
}

message TranscriptionResponse {
  bool success = 1;
  string transcript = 2;
  double confidence = 3;
  string message = 4;
}

message SpeechRequest {
  string text = 1;
  string language_code = 2;
  string voice_name = 3;
}

message SpeechResponse {
  bool success = 1;
  bytes audio_content = 2;
  string content_type = 3;
  string message = 4;
}

// ─── Integration Event Logging ─────────────────────────────────────

message IntegrationEventRequest {
  string event_type = 1;
  string payload_json = 2;
}

message IntegrationEventResponse {
  bool success = 1;
  string message = 2;
}

// ─── Service ───────────────────────────────────────────────────────

service IntegrationService {
  rpc UploadDocument(DocumentUploadRequest) returns (DocumentUploadResponse);
  rpc CreateCalendarEvent(CalendarEventRequest) returns (CalendarEventResponse);
  rpc SendCareEmail(EmailRequest) returns (EmailResponse);
  rpc LookupDrugLabel(DrugLabelRequest) returns (DrugLabelResponse);
  rpc SearchPharmacies(PharmacySearchRequest) returns (PharmacySearchResponse);
  rpc BuildCareRoute(CareRouteRequest) returns (CareRouteResponse);
  rpc StoreMedicalMemory(StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc SearchMedicalMemory(SearchMemoryRequest) returns (SearchMemoryResponse);
  rpc TranscribeAudio(AudioRequest) returns (TranscriptionResponse);
  rpc SynthesizeSpeech(SpeechRequest) returns (SpeechResponse);
  rpc LogIntegrationEvent(IntegrationEventRequest) returns (IntegrationEventResponse);
}
